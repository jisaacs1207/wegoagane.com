name = "wegoagane-api"
main = "src/index.ts"
compatibility_date = "2026-04-23"

# Workers Logs (see https://developers.cloudflare.com/workers/observability/logs/workers-logs/)
[observability]
enabled = true
head_sampling_rate = 1

# Route API traffic on the live domain through this Worker.
routes = [
  { pattern = "wegoagane.com/api/*", zone_name = "wegoagane.com" },
  { pattern = "www.wegoagane.com/api/*", zone_name = "wegoagane.com" }
]

[vars]
APP_ENV = "dev"
SITE_ORIGIN = "https://wegoagane.com"
AI_ENABLED = "false"
AI_GATEWAY_URL = "https://openrouter.ai/api/v1/chat/completions"
AI_MODEL_DESTINY = "openrouter/auto"
AI_MODEL_MEMORIAL = "openrouter/auto"
AI_APP_TITLE = "wegoagane-api"
AI_PROVIDER_SORT = "latency"

[[d1_databases]]
binding = "DB"
database_name = "wegoagane"
database_id = "6a55f3b2-2222-4f2e-8951-d5763075d3ee"

[env.preview]
name = "wegoagane-api-preview"

[env.preview.vars]
APP_ENV = "preview"
SITE_ORIGIN = "https://wegoagane.com"
AI_ENABLED = "false"
AI_GATEWAY_URL = "https://openrouter.ai/api/v1/chat/completions"
AI_MODEL_DESTINY = "openrouter/auto"
AI_MODEL_MEMORIAL = "openrouter/auto"
AI_APP_TITLE = "wegoagane-api"
AI_PROVIDER_SORT = "latency"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "wegoagane-preview"
database_id = "b550b523-ba75-4d45-878d-ec327306c508"

[env.production]
name = "wegoagane-api-production"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.vars]
APP_ENV = "production"
SITE_ORIGIN = "https://wegoagane.com"
# OpenRouter: set secret AI_GATEWAY_TOKEN in Cloudflare; flip to "false" to force template-only.
AI_ENABLED = "true"
AI_GATEWAY_URL = "https://openrouter.ai/api/v1/chat/completions"
AI_MODEL_DESTINY = "openrouter/auto"
AI_MODEL_MEMORIAL = "openrouter/auto"
AI_APP_TITLE = "wegoagane-api"
AI_PROVIDER_SORT = "latency"

[[env.production.d1_databases]]
binding = "DB"
database_name = "wegoagane"
database_id = "6a55f3b2-2222-4f2e-8951-d5763075d3ee"
