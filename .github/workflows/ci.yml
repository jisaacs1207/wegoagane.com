# Continuous integration — start minimal, extend as the repo grows.
# See docs/handoff/04-engineering-data-ops.md §17.4
#
# If you add a NEW named job that must gate merges to main, add that job name
# to the branch ruleset (e.g. wegoagane-main-ci). See docs/github-setup.md
# "Profile B + new CI jobs".
#
# checkout@v4 used Node 20 (deprecated on hosted runners). v5+ uses Node 24.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handbook:
    name: Handbook layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify canonical docs exist
        run: |
          set -euo pipefail
          test -f docs/handoff/README.md
          test -f docs/handoff/STATUS.md
          test -f docs/github-setup.md
          test -f docs/deploy-wegoagane-com.md
          test -f docs/wegoagane-handoff-v4.md
          test -f README.md
          test -f apps/web/package.json
          test -f packages/api/package.json
          test -f packages/api/wrangler.toml
          test -f apps/web/public/_redirects
          test -f docs/wegoagane-handoff-v4-archive.md
          for f in \
            docs/handoff/00-vision-scope-personas.md \
            docs/handoff/01-flows-cards-rating.md \
            docs/handoff/02-content-truth-ai.md \
            docs/handoff/03-design-share-ritual.md \
            docs/handoff/04-engineering-data-ops.md \
            docs/handoff/05-trust-legal-monetization-roadmap.md \
            docs/handoff/06-risks-open-decisions-checklist.md \
            docs/handoff/07-reference-hc-mechanics.md \
            docs/handoff/08-reference-widget-demos.md
          do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "Handbook layout OK."

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install, lint, test, build
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/api/package-lock.json

      - name: Install, typecheck, test
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Verify migration drift
        run: |
          npm run db:generate
          git diff --exit-code migrations

      - name: Verify migrations apply locally from scratch
        run: |
          npm run db:migrate:local

      - name: Verify wrangler route scoping safety
        run: |
          npm run check:routes
