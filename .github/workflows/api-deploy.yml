name: API Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "packages/api/**"
      - ".github/workflows/api-deploy.yml"

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/api/package-lock.json

      - name: Install and typecheck API
        run: |
          npm ci --prefix packages/api
          npm run typecheck --prefix packages/api

      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:production --prefix packages/api

      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:production --prefix packages/api
