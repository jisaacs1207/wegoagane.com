name: API Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "packages/api/**"
      - ".github/workflows/api-deploy.yml"

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/api/package-lock.json

      - name: Install and typecheck API
        run: |
          npm ci --prefix packages/api
          npm run typecheck --prefix packages/api
          npm run test --prefix packages/api

      - name: Verify AI/OpenRouter deploy inputs
        env:
          API_AI_ENABLED: ${{ vars.API_AI_ENABLED }}
          API_AI_GATEWAY_URL: ${{ vars.API_AI_GATEWAY_URL }}
          API_AI_MODEL_DESTINY: ${{ vars.API_AI_MODEL_DESTINY }}
          API_AI_MODEL_MEMORIAL: ${{ vars.API_AI_MODEL_MEMORIAL }}
          API_AI_GATEWAY_TOKEN: ${{ secrets.API_AI_GATEWAY_TOKEN }}
        run: |
          if [ "${API_AI_ENABLED}" = "true" ]; then
            test -n "${API_AI_GATEWAY_URL}" || { echo "Missing vars.API_AI_GATEWAY_URL (OpenRouter endpoint)"; exit 1; }
            test -n "${API_AI_MODEL_DESTINY}" || { echo "Missing vars.API_AI_MODEL_DESTINY"; exit 1; }
            test -n "${API_AI_MODEL_MEMORIAL}" || { echo "Missing vars.API_AI_MODEL_MEMORIAL"; exit 1; }
            test -n "${API_AI_GATEWAY_TOKEN}" || { echo "Missing secrets.API_AI_GATEWAY_TOKEN (OpenRouter API key)"; exit 1; }
          fi

      - name: Verify PostHog deploy inputs
        env:
          API_POSTHOG_ENABLED: ${{ vars.API_POSTHOG_ENABLED }}
          API_POSTHOG_HOST: ${{ vars.API_POSTHOG_HOST }}
          API_POSTHOG_PROJECT_API_KEY: ${{ secrets.API_POSTHOG_PROJECT_API_KEY }}
        run: |
          if [ "${API_POSTHOG_ENABLED}" = "true" ]; then
            test -n "${API_POSTHOG_HOST}" || { echo "Missing vars.API_POSTHOG_HOST (US cloud: https://us.i.posthog.com)"; exit 1; }
            test -n "${API_POSTHOG_PROJECT_API_KEY}" || { echo "Missing secrets.API_POSTHOG_PROJECT_API_KEY"; exit 1; }
          fi

      - name: Verify memory-bias deploy inputs
        env:
          API_MEMORY_BIAS_ENABLED: ${{ vars.API_MEMORY_BIAS_ENABLED }}
          API_MEMORY_BROWSER_WEIGHT: ${{ vars.API_MEMORY_BROWSER_WEIGHT }}
          API_MEMORY_SERVER_WEIGHT: ${{ vars.API_MEMORY_SERVER_WEIGHT }}
          API_MEMORY_MAX_BIAS: ${{ vars.API_MEMORY_MAX_BIAS }}
          API_MEMORY_DEGRADE_MODE: ${{ vars.API_MEMORY_DEGRADE_MODE }}
          API_MEMORY_DEGRADE_SCALE: ${{ vars.API_MEMORY_DEGRADE_SCALE }}
          API_MEMORY_LOOKBACK_LIMIT: ${{ vars.API_MEMORY_LOOKBACK_LIMIT }}
        run: |
          if [ "${API_MEMORY_BIAS_ENABLED}" = "true" ]; then
            test -n "${API_MEMORY_BROWSER_WEIGHT}" || { echo "Missing vars.API_MEMORY_BROWSER_WEIGHT"; exit 1; }
            test -n "${API_MEMORY_SERVER_WEIGHT}" || { echo "Missing vars.API_MEMORY_SERVER_WEIGHT"; exit 1; }
            test -n "${API_MEMORY_MAX_BIAS}" || { echo "Missing vars.API_MEMORY_MAX_BIAS"; exit 1; }
            test -n "${API_MEMORY_DEGRADE_MODE}" || { echo "Missing vars.API_MEMORY_DEGRADE_MODE"; exit 1; }
            test -n "${API_MEMORY_DEGRADE_SCALE}" || { echo "Missing vars.API_MEMORY_DEGRADE_SCALE"; exit 1; }
            test -n "${API_MEMORY_LOOKBACK_LIMIT}" || { echo "Missing vars.API_MEMORY_LOOKBACK_LIMIT"; exit 1; }
          fi

      - name: Verify growth engine deploy inputs
        env:
          API_GROWTH_AUTOPILOT_ENABLED: ${{ vars.API_GROWTH_AUTOPILOT_ENABLED }}
          API_GROWTH_HARD_STOP_ENABLED: ${{ vars.API_GROWTH_HARD_STOP_ENABLED }}
          API_GROWTH_DEFAULT_TRAFFIC_PERCENT: ${{ vars.API_GROWTH_DEFAULT_TRAFFIC_PERCENT }}
          API_GROWTH_DEFAULT_HOLDOUT_PERCENT: ${{ vars.API_GROWTH_DEFAULT_HOLDOUT_PERCENT }}
          API_GROWTH_MIN_SAMPLE_SIZE: ${{ vars.API_GROWTH_MIN_SAMPLE_SIZE }}
          API_GROWTH_CONTROL_TOKEN: ${{ secrets.API_GROWTH_CONTROL_TOKEN }}
        run: |
          if [ "${API_GROWTH_AUTOPILOT_ENABLED}" = "true" ]; then
            test -n "${API_GROWTH_HARD_STOP_ENABLED}" || { echo "Missing vars.API_GROWTH_HARD_STOP_ENABLED"; exit 1; }
            test -n "${API_GROWTH_DEFAULT_TRAFFIC_PERCENT}" || { echo "Missing vars.API_GROWTH_DEFAULT_TRAFFIC_PERCENT"; exit 1; }
            test -n "${API_GROWTH_DEFAULT_HOLDOUT_PERCENT}" || { echo "Missing vars.API_GROWTH_DEFAULT_HOLDOUT_PERCENT"; exit 1; }
            test -n "${API_GROWTH_MIN_SAMPLE_SIZE}" || { echo "Missing vars.API_GROWTH_MIN_SAMPLE_SIZE"; exit 1; }
            test -n "${API_GROWTH_CONTROL_TOKEN}" || { echo "Missing secrets.API_GROWTH_CONTROL_TOKEN"; exit 1; }
          fi

      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:production --prefix packages/api

      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:production --prefix packages/api
